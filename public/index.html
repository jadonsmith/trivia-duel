<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>Trivia Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<main class="app">

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="logo">
      <span class="logo-mark">‼</span>
      <h1>Trivia<span>Duel</span></h1>
    </div>
    <p class="tagline">Two players. Eight questions. Fastest correct answer wins the round.</p>

    <label class="field">
      <span>Your name</span>
      <input id="name-input" type="text" maxlength="16" placeholder="e.g. Alex" autocomplete="off" />
    </label>

    <button class="btn btn-primary" id="btn-quick">
      <span>Quick Match</span><small>Play a random opponent</small>
    </button>

    <div class="divider"><span>or play a friend</span></div>

    <div class="row">
      <button class="btn btn-ghost" id="btn-create">Create Room</button>
      <button class="btn btn-ghost" id="btn-join-open">Join Room</button>
    </div>

    <div class="join-box hidden" id="join-box">
      <input id="code-input" type="text" maxlength="4" placeholder="CODE" autocomplete="off" />
      <button class="btn btn-primary sm" id="btn-join">Go</button>
    </div>

    <p class="msg" id="home-msg"></p>
  </section>

  <!-- WAITING -->
  <section class="screen" id="screen-wait">
    <div class="spinner"></div>
    <h2 id="wait-title">Finding an opponent…</h2>
    <div class="code-display hidden" id="code-display">
      <span>Room code</span>
      <strong id="room-code">----</strong>
      <button class="btn btn-ghost sm" id="btn-copy">Copy</button>
    </div>
    <p class="hint" id="wait-hint">Hang tight — matching you with another player.</p>
    <button class="btn btn-ghost sm" id="btn-cancel">Cancel</button>
  </section>

  <!-- COUNTDOWN -->
  <section class="screen" id="screen-count">
    <p class="vs-names"><span id="cd-you">You</span> <em>vs</em> <span id="cd-opp">Opponent</span></p>
    <div class="countdown" id="countdown">3</div>
    <p class="hint">Get ready…</p>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game">
    <header class="game-head">
      <div class="score-chip me">
        <span class="s-name" id="g-you-name">You</span>
        <span class="s-val" id="g-you-score">0</span>
      </div>
      <div class="round-pill"><span id="g-round">1</span><i>/</i><span id="g-total">8</span></div>
      <div class="score-chip opp">
        <span class="s-name" id="g-opp-name">Opp</span>
        <span class="s-val" id="g-opp-score">0</span>
      </div>
    </header>

    <div class="timer-row">
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <span class="timer-secs" id="timer-secs">20</span>
    </div>

    <div class="q-meta"><span id="q-cat">Category</span><span class="dot"></span><span id="q-diff">medium</span></div>
    <h2 class="question" id="q-text">Question…</h2>

    <div class="options" id="options"></div>

    <p class="answer-status" id="answer-status"></p>
  </section>

  <!-- GAME OVER -->
  <section class="screen" id="screen-over">
    <h2 class="result-title" id="result-title">You win!</h2>
    <div class="final-scores">
      <div class="final me"><span id="f-you-name">You</span><strong id="f-you-score">0</strong></div>
      <div class="final opp"><span id="f-opp-name">Opp</span><strong id="f-opp-score">0</strong></div>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="btn-rematch">Rematch</button>
      <button class="btn btn-ghost" id="btn-home">Home</button>
    </div>
    <p class="msg" id="over-msg"></p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
